[project]
name = "mailcow-dav-mcp"
version = "0.2.1"
description = "MCP server for mailcow/SOGo contacts (CardDAV), calendar and tasks (CalDAV)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["mcp", "mailcow", "sogo", "carddav", "caldav", "claude", "chatgpt", "codex"]
dependencies = [
    "mcp[cli]>=1.10,<2",
    "httpx>=0.27",
    "lxml>=5.0",
    "vobject>=0.9.7",
    "icalendar>=6.0",
    "recurring-ical-events>=3.0",
    "python-dateutil>=2.8",
    "uvicorn>=0.30",
    "anyio>=4",
]

[project.urls]
Homepage = "https://github.com/OakNet-io/mailcow-dav-mcp"
Issues = "https://github.com/OakNet-io/mailcow-dav-mcp/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mailcow-dav-mcp = "mailcow_dav_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mailcow_dav_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
